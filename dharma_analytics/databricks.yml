# This is a Databricks asset bundle definition for dharma_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dharma_analytics
  uuid: 75d529ed-dacd-4bc5-95fa-f846f909af92

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405610432283433.13.azuredatabricks.net
    variables:
      catalog: bake_house_analytics
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://adb-7405610432283433.13.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/poondladharmendra@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/poondladharmendra@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev_dharma
      schema: prod
    permissions:
      - user_name: poondladharmendra@gmail.com
        level: CAN_MANAGE
